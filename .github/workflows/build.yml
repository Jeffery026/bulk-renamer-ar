name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk   muid-al-tasmiya-arm64.apk   || true
          mv app-armeabi-v7a-release.apk muid-al-tasmiya-arm32.apk   || true
          mv app-x86_64-release.apk      muid-al-tasmiya-x86_64.apk  || true
          ls -lh *.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "مُعيد التسمية v1.0.0"
          body: |
            ## مُعيد التسمية الجماعية
            - إضافة بادئة / لاحقة / في أي موضع بزرّي +-
            - ترقيم تلقائي اختياري (لا إجبار)
            - حذف من البداية / النهاية / أي موضع
            - تغيير الاسم / الامتداد / حالة الأحرف / استبدال
            - معاينة قبل التنفيذ
            - حفظ الإعدادات وتحميلها
            
            **نزّل `arm64` لأجهزة 2018 وما بعدها**
          files: |
            build/app/outputs/flutter-apk/muid-al-tasmiya-arm64.apk
            build/app/outputs/flutter-apk/muid-al-tasmiya-arm32.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
